<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pessoais - Manual</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://tailwindcss.com"></script>
    <!-- Chart.js para gráficos elegantes -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome para ícones modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Ajuste fino para esconder barras de rolagem mantendo a função de scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24 selection:bg-emerald-500 selection:text-slate-950">

    <!-- HEADER / TOPO -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-wallet text-emerald-500"></i> MyFinances
            </h1>
            <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">Modo Manual</span>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

        <!-- DASHBOARD (CARDS PRINCIPAIS) -->
        <section class="grid grid-cols-2 gap-3">
            <!-- Saldo Geral -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 col-span-2 shadow-xl">
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Saldo Geral Estimado</p>
                <p id="saldo-geral" class="text-3xl font-bold mt-1 text-slate-100">R$ 0,00</p>
            </div>
            <!-- Receitas -->
            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80">
                <div class="flex items-center gap-2 text-emerald-500">
                    <i class="fa-solid fa-circle-arrow-up text-sm"></i>
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Receitas</span>
                </div>
                <p id="total-receitas" class="text-lg font-bold mt-1 text-emerald-400">R$ 0,00</p>
            </div>
            <!-- Despesas -->
            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80">
                <div class="flex items-center gap-2 text-rose-500">
                    <i class="fa-solid fa-circle-arrow-down text-sm"></i>
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Despesas</span>
                </div>
                <p id="total-despesas" class="text-lg font-bold mt-1 text-rose-400">R$ 0,00</p>
            </div>
            <!-- Fatura Cartão -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 col-span-2 flex justify-between items-center bg-gradient-to-r from-slate-900 to-indigo-950/30">
                <div>
                    <p class="text-xs text-indigo-400 font-medium uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-credit-card"></i> Fatura Cartão
                    </p>
                    <p id="fatura-cartao" class="text-xl font-bold mt-1 text-indigo-200">R$ 0,00</p>
                </div>
                <i class="fa-solid fa-cc-mastercard text-2xl text-slate-600"></i>
            </div>
        </section>
<!-- GRÁFICO POR CATEGORIAS -->
        <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-emerald-500"></i> Gastos por Categoria
            </h3>
            <div class="relative w-full h-48 flex items-center justify-center">
                <canvas id="chartCategorias"></canvas>
                <div id="chart-fallback" class="absolute text-xs text-slate-500 hidden">Nenhuma despesa este mês</div>
            </div>
        </section>

        <!-- EXTRATO / LANÇAMENTOS RECENTES -->
        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-emerald-500"></i> Últimos Lançamentos
                </h3>
                <button onclick="limparTudo()" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">Limpar dados</button>
            </div>
            <div id="lista-transacoes" class="space-y-2 max-h-80 overflow-y-auto no-scrollbar">
                <!-- Itens inseridos dinamicamente via JavaScript -->
            </div>
        </section>

    </main>

    <!-- BOTÃO FLUTUANTE DE LANÇAMENTO RÁPIDO -->
    <button onclick="abrirModal()" class="fixed bottom-6 right-6 bg-emerald-500 text-slate-950 w-14 h-14 rounded-full shadow-2xl flex items-center justify-center font-bold text-2xl hover:scale-105 active:scale-95 transition-all z-50 focus:outline-none">
        <i class="fa-solid fa-plus"></i>
    </button>
<!-- MODAL DE INSERÇÃO DE GASTOS -->
    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all duration-300">
        <div class="bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl border-t sm:border border-slate-800 p-6 space-y-4 shadow-2xl transform translate-y-full transition-transform duration-300" id="modal-content">
            
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-100">Novo Lançamento</h2>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="form-transacao" onsubmit="salvarTransacao(event)" class="space-y-4">
                
                <!-- VALOR (Com máscara e estilo dinâmico de cor) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Valor</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl font-bold text-slate-400">R$</span>
                        <input type="text" id="valor" required placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-12 pr-4 text-2xl font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>

                <!-- TIPO (Toggle entre Receita e Despesa) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tipo</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button type="button" id="btn-despesa" onclick="setTipo('despesa')" class="py-2 text-sm font-medium rounded-lg transition-all bg-rose-500/20 text-rose-400 border border-rose-500/30">Despesa</button>
                        <button type="button" id="btn-receita" onclick="setTipo('receita')" class="py-2 text-sm font-medium rounded-lg transition-all text-slate-400">Receita</button>
                    </div>
                </div>

                <!-- CATEGORIA -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Categoria</label>
                    <select id="categoria" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="Alimentação">🛒 Alimentação</option>
                        <option value="Transporte">🚗 Transporte</option>
                        <option value="Moradia">🏠 Moradia</option>
                        <option value="Lazer">🍿 Lazer</option>
                        <option value="Salário">💰 Salário / Renda</option>
                        <option value="Outros">📦 Outros</option>
                    </select>
                </div>

                <!-- CONTA / ORIGEM -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Conta / Origem</label>
                    <select id="origem" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="Dinheiro">💵 Dinheiro em Espécie</option>
                        <option value="Conta Corrente">🏦 Conta Corrente / PIX</option>
                        <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
                    </select>
                </div>

                <!-- DATA E DESCRIÇÃO -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Data</label>
                        <input type="date" id="data" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Descrição</label>
                        <input type="text" id="descricao" placeholder="Ex: Mercado" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-3.5 rounded-xl mt-2 active:scale-[0.98] transition-all hover:bg-emerald-400">
                    Confirmar Lançamento
                </button>
            </form>
        </div>
    </div>
<script>
        // Inicialização do estado baseado no LocalStorage privado
        let transacoes = JSON.parse(localStorage.getItem('transacoes')) || [];
        let tipoSelecionado = 'despesa';
        let meuGrafico = null;

        window.onload = function() {
            document.getElementById('data').valueAsDate = new Date();
            configurarMascaraMoeda();
            atualizarInterface();
        };

        // Controle de abertura e fechamento com animação Smooth CSS
        function abrirModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('translate-y-full');
            }, 10);
            
            // Força o foco do input de dinheiro e abre o teclado numérico no mobile
            setTimeout(() => {
                const inputValor = document.getElementById('valor');
                inputValor.focus();
                inputValor.select();
            }, 100);
        }

        function fecharModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('form-transacao').reset();
                document.getElementById('data').valueAsDate = new Date();
                setTipo('despesa');
            }, 300);
        }

        // Altera visualmente o formulário de acordo com a seleção de Receita/Despesa
        function setTipo(tipo) {
            tipoSelecionado = tipo;
            const btnDespesa = document.getElementById('btn-despesa');
            const btnReceita = document.getElementById('btn-receita');
            const inputValor = document.getElementById('valor');

            if (tipo === 'despesa') {
                btnDespesa.className = "py-2 text-sm font-medium rounded-lg transition-all bg-rose-500/20 text-rose-400 border border-rose-500/30";
                btnReceita.className = "py-2 text-sm font-medium rounded-lg transition-all text-slate-400";
                inputValor.className = inputValor.className.replace('text-emerald-400', 'text-rose-400');
            } else {
                btnReceita.className = "py-2 text-sm font-medium rounded-lg transition-all bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                btnDespesa.className = "py-2 text-sm font-medium rounded-lg transition-all text-slate-400";
                inputValor.className = inputValor.className.replace('text-rose-400', 'text-emerald-400');
            }
        }

        // Regra de máscara: transforma "150" digitado em "1,50" em tempo real
        function configurarMascaraMoeda() {
            const input = document.getElementById('valor');
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                value = (value / 100).toFixed(2) + '';
                value = value.replace(".", ",");
                value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
                e.target.value = value === '0,00' ? '' : value;
            });
        }

        function converterValorNumerico(stringValor) {
            if (!stringValor) return 0;
            return parseFloat(stringValor.replace(/\./g, '').replace(',', '.'));
        }

        // Salva e persiste os dados
        function salvarTransacao(e) {
            e.preventDefault();

            const valorText = document.getElementById('valor').value;
            const valor = converterValorNumerico(valorText);
            const categoria = document.getElementById('categoria').value;
            const origem = document.getElementById('origem').value;
            const data = document.getElementById('data').value;
            const descricao = document.getElementById('descricao').value || categoria;

            if (valor <= 0) return alert('Insira um valor válido.');

            const novaTransacao = {
                id: Date.now(),
                valor,
                tipo: tipoSelecionado,
                categoria,
                origem,
                data,
                descricao
            };

            transacoes.push(novaTransacao);
            localStorage.setItem('transacoes', JSON.stringify(transacoes));
            
            atualizarInterface();
            fecharModal();
        }

        function deletarTransacao(id) {
            transacoes = transacoes.filter(t => t.id !== id);
            localStorage.setItem('transacoes', JSON.stringify(transacoes));
            atualizarInterface();
        }

        function limparTudo() {
            if (confirm('Tem certeza que deseja apagar todo o histórico de lançamentos?')) {
                transacoes = [];
                localStorage.removeItem('transacoes');
                atualizarInterface();
            }
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Atualiza a tela de extrato, reconstrói o gráfico e recalcula os cards
        function atualizarInterface() {
            let saldoGeral = 0;
            let receitas = 0;
            let despesas = 0;
            let faturaCartao = 0;

            const lista = document.getElementById('lista-transacoes');
            lista.innerHTML = '';

            const categoriasDados = {};
            const transacoesOrdenadas = [...transacoes].sort((a, b) => new Date(b.data) - new Date(a.data));

            transacoesOrdenadas.forEach(t => {
                if (t.tipo === 'receita') {
                    receitas += t.valor;
                    saldoGeral += t.valor;
                } else {
                    despesas += t.valor;
                    saldoGeral -= t.valor;
                    
                    if (t.origem === 'Cartão de Crédito') {
                        faturaCartao += t.valor;
                    }
                    categoriasDados[t.categoria] = (categoriasDados[t.categoria] || 0) + t.valor;
                }

                const div = document.createElement('div');
                div.className = "bg-slate-900/40 p-3.5 rounded-xl border border-slate-800/60 flex justify-between items-center";
                
                const isReceita = t.tipo === 'receita';
                const corValor = isReceita ? 'text-emerald-400' : 'text-rose-400';
                const sinal = isReceita ? '+' : '-';
                const dataFormatada = t.data.split('-').reverse().slice(0,2).join('/');

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-xs text-slate-400 font-medium">
                            ${dataFormatada}
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-200">${t.descricao}</p>
                            <p class="text-xs text-slate-500">${t.categoria} • ${t.origem}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold ${corValor}">${sinal} ${formatarMoeda(t.valor)}</span>
                        <button onclick="deletarTransacao(${t.id})" class="text-slate-600 hover:text-rose-400 p-1 transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                lista.appendChild(div);
            });

            document.getElementById('saldo-geral').innerText = formatarMoeda(saldoGeral);
            document.getElementById('total-receitas').innerText = formatarMoeda(receitas);
            document.getElementById('total-despesas').innerText = formatarMoeda(despesas);
            document.getElementById('fatura-cartao').innerText = formatarMoeda(faturaCartao);

            if (transacoes.length === 0) {
                lista.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Nenhum lançamento manual efetuado.</p>`;
            }

            atualizarGrafico(categoriasDados);
        }

        // Renderiza o gráfico Donut usando Chart.js
        function atualizarGrafico(dados) {
            const ctx = document.getElementById('chartCategorias').getContext('2d');
            const fallback = document.getElementById('chart-fallback');
            
            const labels = Object.keys(dados);
            const valores = Object.values(dados);

            if (labels.length === 0) {
                fallback.classList.remove('hidden');
                if (meuGrafico) meuGrafico.destroy();
                return;
            } else {
                fallback.classList.add('hidden');
            }

            if (meuGrafico) meuGrafico.destroy();

            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: ['#34d399', '#f87171', '#818cf8', '#fbbf24', '#f472b6', '#94a3b8'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 12 }
                        }
                    },
                    cutout: '75%'
                }
            });
        }
    </script>
</body>
</html>
